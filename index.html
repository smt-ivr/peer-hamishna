<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת ניהול מבחנים</title>
    <link rel="icon" type="image/png" href="https://smt-tel-manager.netlify.app/smt.png">
    <link rel="stylesheet" href="/peer/styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- מסך התחברות ובדיקת הרשאות (מעל האתר) -->
    <div id="auth-overlay" class="modal hidden" style="display: flex; z-index: 9999; background: rgba(248, 250, 252, 0.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);">
        <div class="modal-content" style="max-width: 380px; height: auto; text-align: center; padding: 30px; border-radius: 8px;">
            <div id="auth-loading">
                <i class="fas fa-spinner fa-spin fa-3x" style="color: var(--primary-color); margin-bottom: 15px;"></i>
                <h3 style="color: var(--text-main);">מוודא הרשאות גישה...</h3>
            </div>
            <div id="auth-form" class="hidden">
                <img src="https://smt-tel-manager.netlify.app/smt.png" class="smt-logo" draggable="false" style="width: 100px; margin: 0 auto 15px auto; display: block;">
                <h2 style="margin-bottom: 10px;">אבטחת מערכת</h2>
                <p id="authMessage" class="text-muted" style="margin-bottom: 20px;">כתובת ה-IP אינה מורשית, נדרשת סיסמה</p>
                <input type="password" id="apiKeyInput" placeholder="הזן מפתח גישה..." class="exam-code-input" style="text-align: center; font-size: 1.1rem; padding: 10px; margin-bottom: 15px;">
                <button id="loginBtn" class="btn btn-primary" style="width: 100%; justify-content: center; height: 38px;">כניסה למערכת</button>
                <div id="loginError" style="color: #ef4444; font-size: 0.85rem; margin-top: 15px; display: none;"></div>
            </div>
        </div>
    </div>

    <!-- מודל הודעות גלובלי (מחליף Alert, Confirm, Prompt) -->
    <div id="customModalOverlay" class="modal hidden" style="z-index: 10000; background: rgba(15, 23, 42, 0.5);">
        <div class="modal-content" style="max-width: 380px; height: auto; text-align: center; padding: 25px; border-radius: 6px;">
            <div id="customModalIcon" style="font-size: 2.5rem; margin-bottom: 10px;"></div>
            <h3 id="customModalTitle" style="margin-bottom: 10px; font-size: 1.1rem;"></h3>
            <p id="customModalMessage" style="margin-bottom: 20px; font-size: 0.9rem; color: var(--text-muted);"></p>
            <div id="customModalInputContainer" class="hidden" style="margin-bottom: 20px;">
                <input type="text" id="customModalInput" class="exam-code-input" style="text-align: center; font-size: 1rem; padding: 8px;">
            </div>
            <div id="customModalButtons" style="display: flex; gap: 10px; justify-content: center;"></div>
        </div>
    </div>

    <div class="app-container">
        <!-- סרגל הצד (Sidebar) המעודכן -->
        <aside class="sidebar no-print">
            <div class="site-title">
                <h2>מערכת ניהול מבחנים</h2>
            </div>
            
            <nav class="menu">
                <a href="#" class="menu-item active" data-target="view-update">
                    <i class="fas fa-edit"></i> עדכון והזנת ציונים
                </a>
                <a href="#" class="menu-item" data-target="view-history">
                    <i class="fas fa-history"></i> היסטוריית מבחנים
                </a>
                <a href="#" class="menu-item" data-target="view-reports">
                    <i class="fas fa-file-invoice"></i> ניהול דוחות
                </a>
                <a href="#" class="menu-item" data-target="view-students">
                    <i class="fas fa-users"></i> ניהול תלמידים
                </a>
                <a href="#" class="menu-item" data-target="view-exams">
                    <i class="fas fa-file-alt"></i> ניהול מבחנים
                </a>
                
                <div style="flex: 1;"></div>
                
                <div class="sidebar-footer">
                    <div class="logo-wrapper">
                        <img src="https://smt-tel-manager.netlify.app/smt.png" alt="SMT Logo" class="smt-logo" draggable="false">
                    </div>
                    <div class="developer-credit">
                        פותח ע"י שימי טרייטל
                    </div>
                </div>

                <a href="#" class="menu-item logout-btn" id="logoutBtn">
                    <i class="fas fa-sign-out-alt"></i> התנתק
                </a>
            </nav>
        </aside>
        
        <main class="main-content">
            <header class="topbar no-print">
                <h1>מערכת ניהול מבחנים</h1>
            </header>

            <div class="content-area">
                <div id="view-update" class="view-section active no-print">
                    <div id="search-section" class="card compact-card">
                        <h3>בחירת תלמיד לעדכון</h3>
                        <p class="text-muted">חפש לפי קוד תלמיד או שם</p>
                        <div class="search-box" style="margin-top: 10px;">
                            <i class="fas fa-search search-icon"></i>
                            <input type="text" id="studentSearch" placeholder="הקלד לחיפוש תלמיד..." autocomplete="off">
                            <div id="searchResults" class="search-results-dropdown hidden"></div>
                        </div>
                    </div>
                    <div id="student-portal" class="student-portal hidden"></div>
                </div>
                <div id="view-history" class="view-section hidden no-print"></div>
                <div id="view-reports" class="view-section hidden"></div>
                <div id="view-students" class="view-section hidden no-print"></div>
                <div id="view-exams" class="view-section hidden no-print"></div>
            </div>
        </main>
    </div>

    <div id="historyModal" class="modal hidden no-print">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-history"></i> היסטוריית מבחנים לתלמיד</h3>
                <button class="close-modal-btn" id="closeModalBtn">&times;</button>
            </div>
            <div class="modal-body" id="modalHistoryBody"></div>
        </div>
    </div>
    
    <script type="module" src="/peer/client-app.js"></script>
</body>
</html>
