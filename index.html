<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול מבחני פאר המשנה</title>
    <link rel="stylesheet" href="/peer/styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar no-print">
            <div class="logo">
                <h2>ניהול מבחני פאר המשנה</h2>
            </div>
            <div class="developer-credit">
                פותח ע"י שימי טרייטל
            </div>
            <nav class="menu">
                <a href="#" class="menu-item active" data-target="view-update">
                    <i class="fas fa-edit"></i> עדכון והזנת ציונים
                </a>
                <a href="#" class="menu-item" data-target="view-history">
                    <i class="fas fa-history"></i> היסטוריית מבחנים
                </a>
                <a href="#" class="menu-item" data-target="view-reports">
                    <i class="fas fa-file-invoice"></i> ניהול דוחות
                </a>
                <a href="#" class="menu-item" data-target="view-students">
                    <i class="fas fa-users"></i> ניהול תלמידים
                </a>
                <a href="#" class="menu-item" data-target="view-exams">
                    <i class="fas fa-file-alt"></i> ניהול מבחנים
                </a>
            </nav>
        </aside>
        
        <main class="main-content">
            <header class="topbar no-print">
                <h1>ניהול מבחני פאר המשנה</h1>
            </header>

            <div class="content-area">
                <!-- מסך 1: עדכון ציונים -->
                <div id="view-update" class="view-section active no-print">
                    <div id="search-section" class="card compact-card">
                        <h3>בחירת תלמיד לעדכון</h3>
                        <p class="text-muted">חפש לפי קוד תלמיד או שם</p>
                        <div class="search-box" style="margin-top: 10px;">
                            <i class="fas fa-search search-icon"></i>
                            <input type="text" id="studentSearch" placeholder="הקלד לחיפוש תלמיד..." autocomplete="off">
                            <div id="searchResults" class="search-results-dropdown hidden"></div>
                        </div>
                    </div>
                    <div id="student-portal" class="student-portal hidden"></div>
                </div>

                <!-- מסך 2: היסטוריית מבחנים -->
                <div id="view-history" class="view-section hidden no-print"></div>

                <!-- מסך 3: ניהול דוחות -->
                <div id="view-reports" class="view-section hidden"></div>

                <!-- מסך 4: ניהול תלמידים -->
                <div id="view-students" class="view-section hidden no-print"></div>

                <!-- מסך 5: ניהול מבחנים -->
                <div id="view-exams" class="view-section hidden no-print"></div>
            </div>
        </main>
    </div>

    <!-- מודל היסטוריית מבחנים -->
    <div id="historyModal" class="modal hidden no-print">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-history"></i> היסטוריית מבחנים לתלמיד</h3>
                <button class="close-modal-btn" id="closeModalBtn">&times;</button>
            </div>
            <div class="modal-body" id="modalHistoryBody">
                <!-- נטען דינאמית -->
            </div>
        </div>
    </div>
    
    <script type="module" src="/peer/client-app.js"></script>
</body>
</html>
