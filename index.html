<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת ניהול פדגוגית - SMT</title>
    <link rel="stylesheet" href="/peer/styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo">
                <h2>ניהול מבחנים</h2>
            </div>
            <nav class="menu">
                <a href="#" class="menu-item active">
                    <i class="fas fa-edit"></i> עדכון והזנת ציונים
                </a>
            </nav>
        </aside>
        
        <main class="main-content">
            <header class="topbar">
                <h1>ניהול מבחני תלמידים</h1>
            </header>

            <div class="content-area">
                <!-- מסך חיפוש תלמיד -->
                <div id="search-section" class="card search-card">
                    <h3>בחירת תלמיד לעדכון</h3>
                    <p class="text-muted">חפש לפי קוד תלמיד, שם פרטי או שם משפחה</p>
                    <div class="search-box">
                        <i class="fas fa-search search-icon"></i>
                        <input type="text" id="studentSearch" placeholder="הקלד לחיפוש תלמיד..." autocomplete="off">
                        <div id="searchResults" class="search-results-dropdown hidden"></div>
                    </div>
                </div>

                <!-- פורטל התלמיד -->
                <div id="student-portal" class="student-portal hidden"></div>
            </div>
        </main>
    </div>

    <!-- מודל היסטוריית מבחנים -->
    <div id="historyModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-history"></i> היסטוריית מבחנים מלאה</h3>
                <button class="close-modal-btn" id="closeModalBtn">&times;</button>
            </div>
            <div class="modal-body" id="modalHistoryBody">
                <!-- נטען דינאמית -->
            </div>
        </div>
    </div>
    
    <script type="module" src="/peer/client-app.js"></script>
</body>
</html>
