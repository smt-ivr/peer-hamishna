<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>פאר המשנה - מערכת ניהול מתקדמת</title>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tom Select לחיפוש מתקדם -->
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>
    
    <link rel="stylesheet" href="/peer/styles.css">
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-top">
                <div class="sidebar-header">
                    <div class="logo-icon"><i class="fas fa-book-reader"></i></div>
                    <h2>פאר המשנה</h2>
                </div>
                <nav id="main-nav" class="sidebar-nav">
                    <button class="nav-btn active" data-tab="update" onclick="document.getElementById('page-title').innerText='עדכון מבחנים'">
                        <i class="fas fa-edit"></i> עדכון מבחנים
                    </button>
                    <button class="nav-btn" data-tab="history" onclick="document.getElementById('page-title').innerText='היסטוריית עדכונים'">
                        <i class="fas fa-history"></i> היסטוריות
                    </button>
                    <button class="nav-btn" data-tab="students" onclick="document.getElementById('page-title').innerText='ניהול תלמידים'">
                        <i class="fas fa-user-graduate"></i> תלמידים
                    </button>
                    <button class="nav-btn" data-tab="exams" onclick="document.getElementById('page-title').innerText='ניהול מבחנים'">
                        <i class="fas fa-file-alt"></i> מבחנים
                    </button>
                </nav>
            </div>
            <div class="sidebar-footer">
                <p>פותח ע"י S.M.T Telephone Systems</p>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div class="header-title">
                    <h1 id="page-title">עדכון מבחנים</h1>
                </div>
                <div class="user-profile">
                    <span class="admin-name">מנהל מערכת</span>
                    <div class="avatar"><i class="fas fa-user-shield"></i></div>
                </div>
            </header>

            <div id="app-content" class="content-area">
                <div class="loader"><i class="fas fa-circle-notch fa-spin"></i> טוען נתונים...</div>
            </div>
        </main>
    </div>

    <script src="/peer/client-app.js"></script>
</body>
</html>
