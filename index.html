<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת ניהול פדגוגית - SMT</title>
    <link rel="stylesheet" href="/peer/styles.css">
    <!-- אייקונים -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- תפריט צד -->
        <aside class="sidebar">
            <div class="logo">
                <h2>ניהול מבחנים</h2>
            </div>
            <nav class="menu">
                <a href="#" class="menu-item active">
                    <i class="fas fa-edit"></i> עדכון והזנת ציונים
                </a>
            </nav>
        </aside>
        
        <!-- תוכן מרכזי -->
        <main class="main-content">
            <header class="topbar">
                <h1>עדכון מבחנים לתלמידים</h1>
            </header>

            <div class="content-area">
                <!-- אזור חיפוש -->
                <div class="card search-card">
                    <h3>בחירת תלמיד לעדכון</h3>
                    <p class="text-muted">חפש לפי קוד תלמיד, שם פרטי או שם משפחה</p>
                    <div class="search-box">
                        <i class="fas fa-search search-icon"></i>
                        <input type="text" id="studentSearch" placeholder="הקלד לחיפוש תלמיד..." autocomplete="off">
                        <div id="searchResults" class="search-results-dropdown hidden"></div>
                    </div>
                </div>

                <!-- אזור פרטי תלמיד וטופס הזנה (מוזרק דרך JS) -->
                <div id="student-portal" class="student-portal hidden">
                    <!-- תוכן נטען כאן דינאמית -->
                </div>
            </div>
        </main>
    </div>
    
    <!-- ייבוא הקובץ הראשי כמודול -->
    <script type="module" src="/peer/client-app.js"></script>
</body>
</html>
