};
window.notify = () => {}; window.customAlert = () => {}; window.customConfirm = async () => true;
import { ExamUpdateManager } from '/client-exam-update.js';
window.em = new ExamUpdateManager('/api', document.getElementById('sp'), () => {}, () => {});
em.loadStudentData('1001');
